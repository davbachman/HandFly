<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HandFly</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas" aria-label="HandFly game canvas"></canvas>
      <video id="camera-feed" playsinline muted></video>
      <canvas id="debug-canvas" aria-label="Hand tracking debug overlay"></canvas>
      <div id="hud" aria-live="polite"></div>
      <div id="menu">
        <div class="menu-panel">
          <h1>HandFly</h1>
          <p>
            Show your open hand to the camera, fingers spread, pointing at the screen.
            Hold it level for a moment to calibrate, then tilt it like a joystick to bank
            and pitch. Make a fist to let go. Keyboard: WASD or arrows, Shift to boost,
            H for the camera debug view, C to recalibrate.
          </p>
          <button id="start-btn" type="button">Start Flight</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
